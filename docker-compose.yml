version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: trading_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: trading_strategy
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - trading-network

  backend:
    build: ./backend
    container_name: trading_backend
    environment:
      DB_USERNAME: root
      DB_PASSWORD: 123456
      JWT_SECRET: tradingStrategySecretKey2024ForJWTTokenGeneration
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trading-network

  frontend:
    build: ./frontend
    container_name: trading_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - trading-network

volumes:
  mysql_data:

networks:
  trading-network:
    driver: bridge
